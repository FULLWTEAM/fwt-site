html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}

function Tool({icon,title,desc,label,children}){

  if(LK.db){try{await fetch(LK.db.replace(/\/+$/,"")+"/profiles/"+u+".json",{method:"PUT",body:JSON.stringify({...o,ts:{".sv":"timestamp"}})})}catch(e){}}
  else{try{localStorage.setItem("fwt-prof-"+u,JSON.stringify({...o,ts:Date.now()}))}catch(e){}}};
 if(!user)return html`<${Login} accts=${accts} onLogin=${k=>{setUser(k);setTab("hub")}}/>${toast}`;
 const a=eff[user]||accts[user];
 const items=MENU.filter(m=>m.on);
 const tabs=[...items.map(m=>[m.id,m.icon,m.label,m]),...(a.admin?[["config","sl","Configuração",null]]:[])];
 const cur=tabs.some(x=>x[0]===tab)?tab:(tabs[0]?tabs[0][0]:"hub");const cm=items.find(m=>m.id===cur);
 const body=cur==="config"?(a.admin?html`<${Config} maps=${maps} setMaps=${setMaps}/>`:html`<${Denied}/>`):
  cm&&cm.kind==="page"?html`<${Page} m=${cm}/>`:cur==="opt"?html`<${Optimize}/>`:cur==="roster"?html`<${Roster} accts=${eff}/>`:cur==="discord"?html`<${Discord}/>`:cur==="steam"?html`<${SteamGroup}/>`:html`<${Hub} disp=${a.disp} maps=${maps}/>`;
 return html`<div class="mx-auto p-4 sm:p-6 lg:flex lg:gap-6 lg:items-start" style=${{maxWidth:1760}}><${Chat} user=${user} accts=${eff} open=${chat} setOpen=${setChat}/><div class="flex-1 min-w-0 w-full mx-auto space-y-4" style=${{maxWidth:1152}}>
  <header class="glass flex items-center gap-3 px-4 py-3" style=${{borderRadius:26,zIndex:30}}>
   <${Logo} s=${34}/><b class="tracking-tight">${SITE.name}</b>
   <div class="ml-auto relative pm"><button class="ghost tap" style=${{padding:".3rem .8rem .3rem .3rem",borderRadius:99}} onClick=${()=>setMenu(!menu)}><${Av} a=${a} s=${32}/><span class="text-sm font-semibold">${a.disp}</span><${I} n="chev" s=${14}/></button>
   ${menu&&html`<div class="glass fade p-2 w-56" style=${{position:"absolute",right:0,marginTop:8,borderRadius:20}}>
    <div class="px-3 py-2 text-xs" style=${{color:M}}>@${user}${a.admin?" · Admin":""}</div>
    <button class="ghost tap w-full" style=${{justifyContent:"flex-start"}} onClick=${()=>{setMenu(false);setSet(true)}}><${I} n="user" s=${16}/> Editar perfil</button>
    <button class="ghost tap w-full mt-1" style=${{justifyContent:"flex-start",color:"#f87171"}} onClick=${()=>{try{localStorage.removeItem("fwt-login")}catch(e){}setMenu(false);setUser(null)}}><${I} n="out" s=${16}/> Terminar sessão</button></div>`}</div></header>
  <nav class="glass nav flex gap-1 p-1.5" style=${{borderRadius:22}}>${tabs.map(([id,ic,l,m])=>html`<button key=${id} onClick=${()=>{if(m&&m.kind==="link"&&m.url)window.open(m.url,"_blank","noopener");else setTab(id)}} class="tap flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap" style=${{background:cur===id?"var(--g)":"transparent",color:cur===id?"#0d1a04":"var(--tx)"}}><${I} n=${P[ic]?ic:"link"} s=${16}/>${l}</button>`)}</nav>
  ${body}${SITE.footer&&html`<p class="text-center text-xs pt-2" style=${{color:M}}>${SITE.footer}</p>`}
  ${toast}${set&&html`<${Settings} user=${user} acc=${a} onClose=${()=>setSet(false)} onSave=${p=>{setAccts({...accts,[user]:{...a,...p}});saveProfile(user,p)}}/>`}</div></div>`;
}
function applyCfg(c){try{
 if(c.maps){SEED.length=0;SEED.push(...c.maps)}
 if(c.accounts){Object.keys(ACC0).forEach(k=>delete ACC0[k]);Object.assign(ACC0,c.accounts)}
 if(c.roster){ROSTER.length=0;ROSTER.push(...c.roster.filter(k=>ACC0[k]))}
 if(c.menu&&c.menu.length){MENU.length=0;MENU.push(...c.menu)}if(c.site){Object.assign(SITE,c.site);document.title=SITE.name}if(c.links)Object.assign(LK,c.links);if(c.news!==undefined)LK.news=c.news}catch(e){}}
const go=()=>ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{if(c)applyCfg(c)}).catch(()=>{}).then(go);
</script>
