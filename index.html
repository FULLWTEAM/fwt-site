function usePWA(){
 const [ip,setIp]=useState(null);const [upd,setUpd]=useState(false);
 const stand=!!((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone);
 useEffect(()=>{
  const bip=e=>{e.preventDefault();setIp(e)};window.addEventListener("beforeinstallprompt",bip);
  if(location.protocol.startsWith("http")&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  let base=null;
  const h=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return x};
  const chk=async()=>{try{const r=await fetch(location.href.split("#")[0],{cache:"no-store"});if(!r.ok)return;let tx=await r.text();try{const q=await fetch("config.json",{cache:"no-store"});if(q.ok)tx+=await q.text()}catch(e){}const v=h(tx);if(base===null)base=v;else if(v!==base)setUpd(true)}catch(e){}};
  chk();const iv=setInterval(chk,60000);const vis=()=>{if(!document.hidden)chk()};document.addEventListener("visibilitychange",vis);
  return()=>{window.removeEventListener("beforeinstallprompt",bip);clearInterval(iv);document.removeEventListener("visibilitychange",vis)};
 },[]);
 return{ip,setIp,upd,stand};
}

 const eff=Object.fromEntries(Object.entries(accts).map(([k,x])=>{const f=fb[k];return [k,f&&(f.ts||0)>(x.pu||0)?{...x,...["disp","bio","avatar","faceit","eh"].reduce((o,z)=>{if(f[z]!==undefined)o[z]=f[z];return o},{})}:x]}));
 useEffect(()=>{
  if(!LK.db){try{if(user){const l=JSON.parse(localStorage.getItem("fwt-prof-"+user));if(l)setFb(f=>({...f,[user]:l}))}}catch(e){}return}
  let on=true;const f=async()=>{try{const r=await fetch(DB()+"/profiles.json",{cache:"no-store"});if(r.ok){const j=await r.json();if(on&&j)setFb(j)}}catch(e){}};f();const i=setInterval(f,60000);return()=>{on=false;clearInterval(i)}},[user]);
 useEffect(()=>{if(!menu)return;const h=e=>{if(!e.target.closest(".pm"))setMenu(false)};document.addEventListener("click",h);return()=>document.removeEventListener("click",h)},[menu]);
 const saveProfile=async(u,p)=>{const o={disp:p.disp,bio:p.bio||"",faceit:p.faceit||"",avatar:p.avatar||"",...(p.eh?{eh:p.eh}:{})};setFb(f=>({...f,[u]:{...o,ts:Date.now()}}));
  if(LK.db){try{await fetch(DB()+"/profiles/"+u+".json",{method:"PUT",body:JSON.stringify({...o,ts:{".sv":"timestamp"}})})}catch(e){}}
  else{try{localStorage.setItem("fwt-prof-"+u,JSON.stringify({...o,ts:Date.now()}))}catch(e){}}};
 const saveMaps=m=>{setMaps(m);if(LK.db&&(eff[user]||{}).admin)fetch(DB()+"/maps.json",{method:"PUT",body:JSON.stringify({list:m,ts:{".sv":"timestamp"}})}).catch(()=>{})};
 useEffect(()=>{if(!LK.db)return;let on=true;(async()=>{try{const r=await fetch(DB()+"/maps.json",{cache:"no-store"});const j=await r.json();if(on&&j&&j.list&&(j.ts||0)>MAPS_TS)setMaps(j.list)}catch(e){}})();return()=>{on=false}},[]);
 const guest=!user;const [lg,setLg]=useState(null);

 const items=MENU.filter(m=>m.on);

 const cur=tabs.some(x=>x[0]===tab)?tab:(tabs[0]?tabs[0][0]:"hub");const cm=items.find(m=>m.id===cur);
 const body=cur==="config"?(a.admin?html`<${Config} maps=${maps} setMaps=${saveMaps}/>`:html`<${Denied}/>`):
  cm&&cm.kind==="page"?html`<${Page} m=${cm}/>`:cur==="opt"?html`<${Optimize}/>`:cur==="servers"?html`<${Servers} guest=${guest}/>`:cur==="skins"?html`<${Skins} user=${user} guest=${guest} ask=${()=>setLg("Entra para guardar o teu loadout de skins.")}/>`:cur==="roster"?html`<${Roster} accts=${eff}/>`:cur==="discord"?html`<${Discord}/>`:cur==="steam"?html`<${SteamGroup}/>`:html`<${Hub} disp=${a.disp} maps=${maps}/>`;
 return html`<div class="mx-auto p-4 sm:p-6 lg:flex lg:gap-6 lg:items-start" style=${{maxWidth:1760}}><${Chat} user=${user} accts=${eff} open=${chat} setOpen=${setChat} guest=${guest} ask=${()=>setLg("Entra para enviar mensagens no chat.")}/><div class="flex-1 min-w-0 w-full mx-auto space-y-4" style=${{maxWidth:1152}}>
  <header class="glass flex items-center gap-3 px-4 py-3" style=${{borderRadius:26,zIndex:30}}>
   <${Logo} s=${34}/><b class="tracking-tight">${SITE.name}</b>
   ${guest?html`<button class="btn tap ml-auto" onClick=${()=>setLg("Entra para editar o teu perfil.")}><${I} n="lock" s=${16}/> Entrar</button>`:html`<div class="ml-auto relative pm"><button class="ghost tap" style=${{padding:".3rem .8rem .3rem .3rem",borderRadius:99}} onClick=${()=>setMenu(!menu)}><${Av} a=${a} s=${32}/><span class="text-sm font-semibold">${a.disp}</span><${I} n="chev" s=${14}/></button>
   ${menu&&html`<div class="glass fade p-2 w-56" style=${{position:"absolute",right:0,marginTop:8,borderRadius:20}}>
    <div class="px-3 py-2 text-xs" style=${{color:M}}>@${user}${a.admin?" · Admin":""}</div>
    <button class="ghost tap w-full" style=${{justifyContent:"flex-start"}} onClick=${()=>{setMenu(false);setSet(true)}}><${I} n="user" s=${16}/> Editar perfil</button>
    <button class="ghost tap w-full mt-1" style=${{justifyContent:"flex-start",color:"#f87171"}} onClick=${()=>{try{localStorage.removeItem("fwt-login")}catch(e){}setMenu(false);setUser(null)}}><${I} n="out" s=${16}/> Terminar sessão</button></div>`}</div>`}</header>
  <nav class="glass nav flex gap-1 p-1.5" style=${{borderRadius:22}}>${tabs.map(([id,ic,l,m])=>html`<button key=${id} onClick=${()=>{if(m&&m.kind==="link"&&m.url)window.open(m.url,"_blank","noopener");else setTab(id)}} class="tap flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-semibold whitespace-nowrap" style=${{background:cur===id?"var(--g)":"transparent",color:cur===id?"#0d1a04":"var(--tx)"}}><${I} n=${P[ic]?ic:"link"} s=${16}/>${l}</button>`)}</nav>
  ${body}${SITE.footer&&html`<p class="text-center text-xs pt-2" style=${{color:M}}>${SITE.footer}</p>`}
  ${lg!==null&&html`<${Login} accts=${eff} reason=${lg} onClose=${()=>setLg(null)} onLogin=${k=>{setUser(k);setTab("hub");setLg(null)}}/>`}${toast}${set&&!guest&&html`<${Settings} user=${user} acc=${a} onClose=${()=>setSet(false)} onSave=${p=>{setAccts({...accts,[user]:{...a,...p}});saveProfile(user,{...p,eh:p.eh!==undefined?p.eh:a.eh})}}/>`}</div></div>`;
}
function applyCfg(c){try{if(c.servers){SERVERS.length=0;SERVERS.push(...c.servers)}MAPS_TS=c.mapsTs||0;
 if(c.maps){SEED.length=0;SEED.push(...c.maps)}
 if(c.accounts){Object.keys(ACC0).forEach(k=>delete ACC0[k]);Object.assign(ACC0,c.accounts)}
 if(c.roster){ROSTER.length=0;ROSTER.push(...c.roster.filter(k=>ACC0[k]))}
 if(c.menu&&c.menu.length){MENU.length=0;MENU.push(...c.menu);DEFMENU.forEach(x=>{if(!MENU.some(m=>m.id===x.id))MENU.push(x)})}if(c.site){Object.assign(SITE,c.site);document.title=SITE.name}if(c.links)Object.assign(LK,c.links);if(c.news!==undefined)LK.news=c.news}catch(e){}}
const go=()=>ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
fetch("config.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{if(c)applyCfg(c)}).catch(()=>{}).then(go);
